<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>@yulim_mood · 프롬프트 아카이브</title>

<style>
:root{
  --bg:#f7f1e8;
  --card:#fffdf9;
  --text:#4a4038;
  --muted:#a08d78;
  --line:#ece0cf;
  --btn:#8c6a4a;
  --btnText:#fffdf9;
  --ok:#5f8a5f;
  --warn:#b4762a;
  color-scheme:light;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  padding:24px 16px 48px;
}

main{
  width:min(100%,620px);
  margin:auto;
}

.brand{
  font-size:.9rem;
  font-weight:800;
  letter-spacing:.02em;
  color:var(--text);
  margin:8px 2px 4px;
}

.tagline{
  font-size:.88rem;
  color:var(--muted);
  margin:0 2px 20px;
  line-height:1.55;
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:25px 20px 18px;
  box-shadow:0 10px 30px rgba(140,106,74,.10);
}

h1{
  font-size:1.8rem;
  margin:0 0 5px;
}

.meta{
  color:var(--muted);
  font-size:.96rem;
  margin-bottom:22px;
}

.cut{
  border-top:1px solid var(--line);
  padding:19px 0 17px;
}

.cut:first-child{
  border-top:0;
  padding-top:2px;
}

.cut-number{
  font-size:.78rem;
  font-weight:800;
  letter-spacing:.14em;
  color:var(--muted);
}

.cut-title{
  font-size:1.12rem;
  font-weight:720;
  margin:7px 0 15px;
  line-height:1.35;
}

.copy{
  width:100%;
  border:0;
  border-radius:13px;
  background:var(--btn);
  color:var(--btnText);
  padding:15px 16px;
  font-size:1rem;
  font-weight:750;
  cursor:pointer;
}

.copy:active{
  transform:scale(.99);
}

.copy:disabled{
  opacity:.65;
  cursor:default;
}

.cut-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:22px;
  margin-top:9px;
}

.count{
  font-size:.82rem;
  color:var(--muted);
  white-space:nowrap;
}

.count b{
  color:var(--btn);
  font-weight:800;
}

.status{
  flex:1;
  font-size:.88rem;
  color:var(--ok);
  text-align:right;
}

.warning{
  color:var(--warn);
}

.notice{
  font-size:.8rem;
  color:var(--muted);
  text-align:center;
  margin:16px 2px 0;
  line-height:1.5;
}

.back{
  display:inline-block;
  margin:0 2px 14px;
  font-size:.88rem;
  color:var(--muted);
  text-decoration:none;
}

.back:hover{
  color:var(--text);
}

a.list-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:16px 18px;
  margin-top:12px;
  text-decoration:none;
  color:var(--text);
  background:var(--card);
}

a.list-link:first-of-type{
  margin-top:2px;
}

a.list-link:hover{
  border-color:var(--muted);
}

.list-name{
  font-size:1.05rem;
  font-weight:750;
}

.list-sub{
  font-size:.85rem;
  color:var(--muted);
}

.list-go{
  font-size:.85rem;
  color:var(--muted);
  white-space:nowrap;
}

.rank-left{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.rank{
  flex:none;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:var(--bg);
  color:var(--muted);
  font-size:.85rem;
  font-weight:800;
}

.rank.top{
  background:var(--btn);
  color:var(--btnText);
}

.rank-info{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
}

.rank-info .list-name{
  white-space:normal;
  line-height:1.3;
}

.rank-info .list-sub{
  white-space:normal;
}

.rank-count{
  font-size:.9rem;
  color:var(--muted);
  white-space:nowrap;
}

.rank-count b{
  color:var(--btn);
  font-weight:800;
  font-size:1.08rem;
}
[hidden]{display:none !important;}
.stats-summary{margin-bottom:20px;}
.stats-summary table{width:100%;border-collapse:collapse;font-size:.85rem;}
.stats-summary caption{text-align:left;font-weight:750;margin-bottom:10px;}
.stats-summary th,.stats-summary td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;}
.stats-summary th:first-child{text-align:left;}
.stats-summary p{line-height:1.6;}
.stats-control{border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);padding:9px;margin:4px 8px 4px 0;cursor:pointer;}
.stats-control:disabled{opacity:.5;cursor:default;}
.stats-growth{display:block;font-size:.75rem;margin-top:6px;white-space:normal;}
.rank-count{flex-shrink:0;text-align:right;max-width:110px;}
.rank-info{overflow-wrap:anywhere;}
@media(max-width:400px){a.list-link{padding:12px 10px;gap:8px;}.rank-left{gap:7px;}.rank{width:25px;height:25px;}.rank-count{max-width:82px;}.stats-summary table{font-size:.76rem;}}
</style>
</head>

<body>
<main>

  <div class="brand">@yulim_mood</div>
  <div class="tagline">Threads에 올린 AI 이미지 프롬프트 모음</div>

  <a
    class="back"
    id="back"
    href="/"
    hidden
  >
    ← 뒤로가기
  </a>

  <div class="panel">

    <h1 id="title">
      프롬프트 아카이브
    </h1>

    <div
      class="meta"
      id="meta"
    >
      데이터를 불러오는 중...
    </div>

    <div id="content"></div>

  </div>

  <div
    class="notice"
    id="notice"
  ></div>

</main>

<script src="/assets/stats.js"></script>
<script>
/* ────────────────────────────────────────────────
   복사 횟수(Copy count) 설정 — Firebase Realtime Database
   아래 FIREBASE_DB 값만 본인 데이터베이스 주소로 교체하세요.
   예) 'https://yulim-mood-default-rtdb.firebaseio.com'
   (교체 전에는 카운트 기능이 자동으로 꺼진 채로 사이트가 정상 동작합니다)
   ──────────────────────────────────────────────── */
const FIREBASE_DB =
  'https://yulim-mood-prompt-archive-default-rtdb.firebaseio.com';

const COUNTS_ENABLED =
  /^https:\/\/.+\.(firebaseio\.com|firebasedatabase\.app)$/i
    .test(FIREBASE_DB) &&
  !FIREBASE_DB.includes('YOUR-PROJECT');

function pageModels(page){
  return (page.models || [page.model]).map(model => String(model).toLowerCase());
}

function pageLabel(page){
  return pageModels(page).map(model => model.toUpperCase()).join(' & ');
}

function allCountKeys(page, cut){
  const legacy = (page.legacy_routes || []).map(route => {
    const parts = route.split('/');
    return countKey({model:parts[1], date:parts[2], set:Number(parts[3].slice(3))}, cut);
  });
  return [...new Set([countKey(page, cut), ...legacy])];
}

function countKey(page, cut){
  return [
    String(page.model).toLowerCase(),
    String(page.date),
    'set' + String(page.source_set || page.set).padStart(2, '0'),
    'cut' + String(cut.cut).padStart(2, '0')
  ].join('_');
}

async function loadCounts(){
  if(!COUNTS_ENABLED){
    return {};
  }

  try{
    const res = await fetch(
      FIREBASE_DB + '/copyCounts.json',
      { cache:'no-store' }
    );

    if(!res.ok){
      return {};
    }

    return (await res.json()) || {};
  }catch(error){
    return {};
  }
}

function bumpCount(key){
  if(!COUNTS_ENABLED){
    return;
  }

  fetch(
    FIREBASE_DB + '/copyCounts/' + key + '.json',
    {
      method:'PUT',
      headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({ '.sv':{ 'increment':1 } })
    }
  ).catch(function(){});
}

function cleanPath(){
  let path = decodeURIComponent(location.pathname)
    .replace(/\/+$/, '');

  return path || '/';
}

function formatDate(date){
  return String(date).replace(
    /(\d{4})(\d{2})(\d{2})/,
    '$1.$2.$3'
  );
}

function fallbackCopy(text){
  const textarea = document.createElement('textarea');

  textarea.value = text;
  textarea.setAttribute('readonly', '');
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';

  document.body.appendChild(textarea);

  textarea.select();
  textarea.setSelectionRange(
    0,
    textarea.value.length
  );

  const result = document.execCommand('copy');

  document.body.removeChild(textarea);

  if(!result){
    throw new Error('copy failed');
  }
}

async function copyText(text){
  if(
    navigator.clipboard &&
    window.isSecureContext
  ){
    await navigator.clipboard.writeText(text);
  }else{
    fallbackCopy(text);
  }
}

function resetBack(){
  document.getElementById('back').hidden = true;
}

function showBack(href, label){
  const back = document.getElementById('back');

  back.href = href;
  back.textContent = label;
  back.hidden = false;
}

function showError(message){
  document.getElementById('title').textContent =
    '페이지를 찾을 수 없어요.';

  document.getElementById('meta').textContent =
    message;

  document.getElementById('content').innerHTML =
    '';

  document.getElementById('notice').textContent =
    '';

  showBack(
    '/',
    '← 전체 목록'
  );
}

function addListLink(
  content,
  href,
  name,
  sub,
  go
){
  const link = document.createElement('a');

  link.className = 'list-link';
  link.href = href;

  const left = document.createElement('span');

  const title = document.createElement('span');

  title.className = 'list-name';
  title.textContent = name;

  const detail = document.createElement('span');

  detail.className = 'list-sub';
  detail.textContent = sub;

  left.append(
    title,
    detail
  );

  const arrow = document.createElement('span');

  arrow.className = 'list-go';
  arrow.textContent = go;

  link.append(
    left,
    arrow
  );

  content.appendChild(link);
}

function renderHome(pages){
  const title =
    document.getElementById('title');

  const meta =
    document.getElementById('meta');

  const content =
    document.getElementById('content');

  const notice =
    document.getElementById('notice');

  const groups = new Map();

  Object.values(pages).filter(page => page && !page.redirect).forEach(page => {
    if(!page.model || !page.date) return;
    const model = page.source_page_id ? `plan-${page.source_page_id}` : String(page.model).toLowerCase();
    const date = String(page.date);
    const key = `${model}|${date}`;
    if(!groups.has(key)) groups.set(key, {model, label:page.source_models ? page.source_models.map(x => x.toUpperCase()).join(" & ") : pageLabel(page), date, sets:0, cuts:0});
    const group = groups.get(key);
    group.sets += 1;
    group.cuts += (page.cuts || []).length;
  });

  const items =
    [...groups.values()]
      .sort((a, b) => {
        const dateCompare =
          b.date.localeCompare(a.date);

        if(dateCompare !== 0){
          return dateCompare;
        }

        return a.model.localeCompare(
          b.model
        );
      });

  document.title =
    '@yulim_mood · 프롬프트 아카이브';

  title.textContent =
    '프롬프트 아카이브';

  meta.textContent =
    `공개된 목록 ${items.length}개`;

  content.innerHTML = '';

  resetBack();

  if(items.length === 0){
    meta.textContent =
      '현재 공개된 프롬프트가 없습니다.';

    notice.textContent = '';

    return;
  }

  items.forEach(item => {
    addListLink(
      content,

      `/archive/${encodeURIComponent(
        item.model
      )}/${item.date}`,

      formatDate(item.date),

      ` · ${item.label} · ${item.sets}세트`,

      '목록 →'
    );
  });

  notice.textContent =
    '날짜를 선택하면 공개된 프롬프트 세트가 표시됩니다.';
}

function parseArchivePath(path){
  const match = path.match(
    /^\/archive\/([a-z0-9_-]+)\/(\d{8})$/i
  );

  if(!match){
    return null;
  }

  return {
    model:match[1].toLowerCase(),
    date:match[2]
  };
}

function renderArchive(
  pages,
  model,
  date
){
  const title =
    document.getElementById('title');

  const meta =
    document.getElementById('meta');

  const content =
    document.getElementById('content');

  const notice =
    document.getElementById('notice');

  const sets =
    Object.keys(pages)
      .map(route => ({
        route:route,
        page:pages[route]
      }))
      .filter(item => {
        if(!item.page || item.page.redirect){
          return false;
        }

        return (
          (model.startsWith("plan-")
            ? item.page.source_page_id === model.slice(5)
            : (pageModels(item.page).includes(model) || item.page.model === model)) &&

          String(item.page.date) === date
        );
      })
      .sort((a, b) => {
        return (a.page.source_set || a.page.set) - (b.page.source_set || b.page.set);
      });

  if(sets.length === 0){
    showError(
      '이 날짜에 공개된 세트가 없습니다.'
    );

    return;
  }

  const archiveLabel = model.startsWith('plan-')
    ? (sets[0].page.source_models || pageModels(sets[0].page)).map(x => x.toUpperCase()).join(' & ')
    : model.includes('--') ? pageLabel(sets[0].page) : model.toUpperCase();
  document.title =
    `${archiveLabel} ${date} Prompt Sets`;

  title.textContent =
    formatDate(date);

  meta.textContent =
    `${archiveLabel} · 공개 세트 ${sets.length}개`;

  content.innerHTML = '';

  showBack(
    '/',
    '← 날짜 목록'
  );

  sets.forEach(item => {
    addListLink(
      content,

      item.route,

      `SET ${String(
        item.page.source_set || item.page.set
      ).padStart(2, '0')}`,

      ` · ${pageLabel(item.page)} · ${(item.page.cuts || []).length}컷`,

      '복사 →'
    );
  });

  notice.textContent =
    '세트를 선택하면 원클릭 복사 페이지로 이동합니다.';
}

function renderPrompt(page){
  const title =
    document.getElementById('title');

  const meta =
    document.getElementById('meta');

  const content =
    document.getElementById('content');

  const notice =
    document.getElementById('notice');

  document.title =
    `${pageLabel(page)} ${page.date} SET ${String(page.source_set || page.set).padStart(2, '0')} Prompt Copy`;

  title.textContent =
    pageLabel(page);

  meta.textContent =
    `${formatDate(page.date)} · SET ${String(page.source_set || page.set).padStart(2, '0')}`;

  content.innerHTML = '';

  showBack(
    `/archive/${page.source_page_id ? "plan-" + page.source_page_id : String(page.model).toLowerCase()}/${page.date}`,
    '← 세트 목록'
  );

  if(pageModels(page).length > 1){
    if(!page.source_page_id) showBack('/', '← 전체 목록');
    const links = document.createElement('div');
    links.className = 'model-links';
    pageModels(page).forEach(model => {
      const link = document.createElement('a');
      link.className = 'back';
      link.href = `/archive/${model}/${page.date}`;
      link.textContent = `${model.toUpperCase()} 세트 목록 →`;
      link.style.marginRight = '16px';
      links.appendChild(link);
    });
    content.appendChild(links);
  }
  const cutRefs = [];

  (page.cuts || []).forEach(cut => {
    const section =
      document.createElement('section');

    section.className =
      'cut';

    section.innerHTML = `
      <div class="cut-number">
        CUT ${String(cut.cut).padStart(2, '0')}
      </div>

      <div class="cut-title"></div>

      <button
        class="copy"
        type="button"
      >
        📋 Copy Prompt
      </button>

      <div class="cut-foot">
        <span class="count"></span>
        <span
          class="status"
          aria-live="polite"
        ></span>
      </div>
    `;

    section
      .querySelector('.cut-title')
      .textContent = cut.title;

    const button =
      section.querySelector('.copy');

    const status =
      section.querySelector('.status');

    const countEl =
      section.querySelector('.count');

    const state = { count:null };

    function renderCount(){
      if(!COUNTS_ENABLED || state.count === null){
        countEl.innerHTML = '';
        return;
      }

      countEl.innerHTML =
        `복사 <b>${state.count.toLocaleString()}</b>회`;
    }

    cutRefs.push({
      keys:allCountKeys(page, cut),
      state:state,
      render:renderCount
    });

    button.onclick = async () => {
      button.disabled = true;

      try{
        await copyText(cut.prompt);

        status.className =
          'status';

        status.textContent =
          '✓ Prompt copied';

        if(COUNTS_ENABLED){
          if(state.count === null){
            state.count = 0;
          }

          state.count += 1;

          renderCount();

          bumpCount(countKey(page, cut));
        }

      }catch(error){
        status.className =
          'status warning';

        status.textContent =
          '복사에 실패했습니다.';

      }finally{
        setTimeout(() => {
          status.textContent = '';
          button.disabled = false;
        }, 1800);
      }
    };

    content.appendChild(section);
  });

  if(COUNTS_ENABLED){
    loadCounts().then(counts => {
      cutRefs.forEach(ref => {
        ref.state.count = ref.keys.reduce((sum, key) =>
          sum + (typeof counts[key] === 'number' ? counts[key] : 0), 0);

        ref.render();
      });
    });
  }

  notice.innerHTML =
    '각 버튼은 해당 컷의 프롬프트만 복사합니다.<br>프롬프트 전문은 화면에 표시되지 않습니다.';
}

async function renderStats(pages){
  const title =
    document.getElementById('title');

  const meta =
    document.getElementById('meta');

  const content =
    document.getElementById('content');

  const notice =
    document.getElementById('notice');

  document.title =
    '@yulim_mood · 복사수 랭킹';

  title.textContent =
    '복사수 랭킹';

  meta.textContent =
    '불러오는 중...';

  content.innerHTML = '';
  notice.textContent = '';

  showBack('/', '← 홈으로');

  if(!COUNTS_ENABLED){
    meta.textContent =
      '복사수 집계가 아직 연결되지 않았습니다.';
    return;
  }

  let counts, history;
  try{
    [counts, history] = await Promise.all([
      fetchStatsJSON(FIREBASE_DB + '/copyCounts.json'),
      fetchStatsJSON('https://raw.githubusercontent.com/foxrain84-tech/foxrain84-tech.github.io/main/stats-history.json?v=' + Date.now()).catch(() => null)
    ]);
    counts = counts || {};
    if(!validStatsCounts(counts)) throw new Error('Invalid counts');
  }catch(error){
    meta.textContent = '복사수를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';
    return;
  }

  const rows = statsRows(pages, counts);
  const baseline = history ? statsBaseline(history) : null;
  const before = baseline ? statsRows(pages, baseline.counts) : [];
  const changedRows = baseline ? statsChanges(rows, before) : rows;

  if(rows.length === 0){
    meta.textContent =
      '아직 복사된 프롬프트가 없습니다.';
    return;
  }

  const total =
    rows.reduce((sum, r) => sum + r.count, 0);

  meta.textContent =
    `총 ${rows.length}개 컷 · 누적 복사 ${total.toLocaleString()}회`;

  const summary = document.createElement('div');
  summary.className = 'stats-summary';
  const previousTotal = before.reduce((sum, row) => sum + row.count, 0);
  const signed = n => (n > 0 ? '+' : '') + n.toLocaleString();
  const table = document.createElement('table');
  table.innerHTML = '<caption>어제 대비 현재 변화</caption><thead><tr><th scope="col">항목</th><th scope="col">어제 저장값</th><th scope="col">현재</th><th scope="col">증감</th></tr></thead>';
  const tbody = document.createElement('tbody');
  [['복사된 컷', before.length, rows.length, '개'], ['누적 복사', previousTotal, total, '회']].forEach(([label, old, current, unit]) => {
    const tr = document.createElement('tr');
    [label, baseline ? old.toLocaleString() + unit : '—', current.toLocaleString() + unit, baseline ? signed(current - old) + unit : '—'].forEach((value, i) => {
      const cell = document.createElement(i === 0 ? 'th' : 'td');
      if(i === 0) cell.scope = 'row';
      cell.textContent = value;
      tr.appendChild(cell);
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  summary.appendChild(table);
  const timing = document.createElement('p');
  timing.className = 'list-sub';
  timing.textContent = baseline
    ? '비교 기준: ' + new Date(baseline.at).toLocaleString('ko-KR', {timeZone:'Asia/Seoul'}) + ' KST (전날 마지막 저장값). 현재: ' + new Date().toLocaleString('ko-KR', {timeZone:'Asia/Seoul'}) + ' KST'
    : '비교 데이터 없음 · 전날 저장 기록이 쌓이면 증감과 순위 변동이 표시됩니다.';
  summary.appendChild(timing);
  const refresh = document.createElement('button');
  refresh.type = 'button';
  refresh.textContent = '새로고침';
  refresh.className = 'stats-control';
  refresh.onclick = () => renderStats(pages);
  summary.appendChild(refresh);
  const filter = document.createElement('button');
  filter.type = 'button';
  filter.textContent = '순위 변동만 보기';
  filter.className = 'stats-control';
  filter.disabled = !baseline;
  filter.setAttribute('aria-pressed', 'false');
  summary.appendChild(filter);
  content.appendChild(summary);
  const rankList = document.createElement('div');
  content.appendChild(rankList);
  const empty = document.createElement('p');
  empty.textContent = '순위가 변동된 컷이 없습니다.';
  empty.hidden = true;
  content.appendChild(empty);
  filter.onclick = () => {
    const enabled = filter.getAttribute('aria-pressed') !== 'true';
    filter.setAttribute('aria-pressed', String(enabled));
    filter.textContent = enabled ? '전체 랭킹 보기' : '순위 변동만 보기';
    let shown = 0;
    [...rankList.children].forEach((el, i) => {
      el.hidden = enabled && changedRows[i].oldRank !== null && changedRows[i].movement === 0;
      if(!el.hidden) shown++;
    });
    empty.hidden = shown > 0;
  };

  changedRows.forEach((row, index) => {
    const link = document.createElement('a');

    link.className = 'list-link';
    link.href = row.route;

    const left = document.createElement('span');
    left.className = 'rank-left';

    const badge = document.createElement('span');
    badge.className = (row.rank <= 3) ? 'rank top' : 'rank';
    badge.textContent = String(row.rank);

    const info = document.createElement('span');
    info.className = 'rank-info';

    const name = document.createElement('span');
    name.className = 'list-name';
    name.textContent = row.title;

    const sub = document.createElement('span');
    sub.className = 'list-sub';
    sub.textContent =
      `${row.model.toUpperCase()} · ${formatDate(row.date)} · SET ${String(row.setNum).padStart(2, '0')} · CUT ${String(row.cutNum).padStart(2, '0')}`;

    info.append(name, sub);
    const movement = document.createElement('span');
    movement.className = 'list-sub stats-movement';
    movement.textContent = baseline ? statsMovement(row) : '— 비교 데이터 없음';
    info.appendChild(movement);
    left.append(badge, info);

    const cnt = document.createElement('span');
    cnt.className = 'rank-count';
    cnt.innerHTML = `<b>${row.count.toLocaleString()}</b>회`;

    const growth = document.createElement('span');
    growth.className = 'stats-growth';
    growth.textContent = baseline ? '어제 대비 ' + signed(row.delta) + '회' : '어제 대비 —';
    cnt.appendChild(growth);
    link.append(left, cnt);
    rankList.appendChild(link);
  });

  notice.textContent =
    '동일 복사수는 공동 순위입니다. 한국 시간 기준 전날 마지막 저장값과 비교하며 자정 확정값은 아닙니다. 비교는 현재 컷·주소 통합 기준으로 계산합니다. 새로고침하면 최신 집계를 확인할 수 있습니다.';
}

(async function(){
  try{
    const response = await fetch(
      '/prompts.json?v=' + Date.now(),
      {
        cache:'no-store'
      }
    );

    if(!response.ok){
      throw new Error(
        'prompts.json load failed'
      );
    }

    const pages =
      await response.json();

    const path =
      cleanPath();

    if(path === '/'){
      renderHome(pages);
      return;
    }

    if(path === '/stats'){
      renderStats(pages);
      return;
    }

    const archive =
      parseArchivePath(path);

    if(archive){
      renderArchive(
        pages,
        archive.model,
        archive.date
      );

      return;
    }

    let page = pages[path];
    if(page && page.redirect){
      const target = page.redirect;
      page = pages[target];
      if(page && !page.redirect) history.replaceState(null, '', target);
    }

    if(!page){
      showError(
        '공개된 세트가 없거나 주소가 잘못되었습니다.'
      );

      return;
    }

    renderPrompt(page);

  }catch(error){
    console.error(error);

    showError(
      '프롬프트 데이터를 불러오지 못했습니다.'
    );
  }
})();
</script>
</body>
</html>
