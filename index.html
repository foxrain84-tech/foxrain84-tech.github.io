<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>@yulim_mood · 프롬프트 아카이브</title>

<style>
:root{
  --bg:#f7f1e8;
  --card:#fffdf9;
  --text:#4a4038;
  --muted:#a08d78;
  --line:#ece0cf;
  --btn:#8c6a4a;
  --btnText:#fffdf9;
  --ok:#5f8a5f;
  --warn:#b4762a;
  color-scheme:light;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  padding:24px 16px 48px;
}

main{
  width:min(100%,620px);
  margin:auto;
}

.brand{
  font-size:.9rem;
  font-weight:800;
  letter-spacing:.02em;
  color:var(--text);
  margin:8px 2px 4px;
}

.tagline{
  font-size:.88rem;
  color:var(--muted);
  margin:0 2px 20px;
  line-height:1.55;
}

.panel{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:25px 20px 18px;
  box-shadow:0 10px 30px rgba(140,106,74,.10);
}

h1{
  font-size:1.8rem;
  margin:0 0 5px;
}

.meta{
  color:var(--muted);
  font-size:.96rem;
  margin-bottom:22px;
}

.cut{
  border-top:1px solid var(--line);
  padding:19px 0 17px;
}

.cut:first-child{
  border-top:0;
  padding-top:2px;
}

.cut-number{
  font-size:.78rem;
  font-weight:800;
  letter-spacing:.14em;
  color:var(--muted);
}

.cut-title{
  font-size:1.12rem;
  font-weight:720;
  margin:7px 0 15px;
  line-height:1.35;
}

.copy{
  width:100%;
  border:0;
  border-radius:13px;
  background:var(--btn);
  color:var(--btnText);
  padding:15px 16px;
  font-size:1rem;
  font-weight:750;
  cursor:pointer;
}

.copy:active{
  transform:scale(.99);
}

.copy:disabled{
  opacity:.65;
  cursor:default;
}

.cut-foot{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  min-height:22px;
  margin-top:9px;
}

.count{
  font-size:.82rem;
  color:var(--muted);
  white-space:nowrap;
}

.count b{
  color:var(--btn);
  font-weight:800;
}

.status{
  flex:1;
  font-size:.88rem;
  color:var(--ok);
  text-align:right;
}

.warning{
  color:var(--warn);
}

.notice{
  font-size:.8rem;
  color:var(--muted);
  text-align:center;
  margin:16px 2px 0;
  line-height:1.5;
}

.back{
  display:inline-block;
  margin:0 2px 14px;
  font-size:.88rem;
  color:var(--muted);
  text-decoration:none;
}

.back:hover{
  color:var(--text);
}

a.list-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  border:1px solid var(--line);
  border-radius:13px;
  padding:16px 18px;
  margin-top:12px;
  text-decoration:none;
  color:var(--text);
  background:var(--card);
}

a.list-link:first-of-type{
  margin-top:2px;
}

a.list-link:hover{
  border-color:var(--muted);
}

.list-name{
  font-size:1.05rem;
  font-weight:750;
}

.list-sub{
  font-size:.85rem;
  color:var(--muted);
}

.list-go{
  font-size:.85rem;
  color:var(--muted);
  white-space:nowrap;
}

.rank-left{
  display:flex;
  align-items:center;
  gap:13px;
  min-width:0;
}

.rank{
  flex:none;
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:var(--bg);
  color:var(--muted);
  font-size:.85rem;
  font-weight:800;
}

.rank.top{
  background:var(--btn);
  color:var(--btnText);
}

.rank-info{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
}

.rank-info .list-name{
  white-space:normal;
  line-height:1.3;
}

.rank-info .list-sub{
  white-space:normal;
}

.rank-count{
  font-size:.9rem;
  color:var(--muted);
  white-space:nowrap;
}

.rank-count b{
  color:var(--btn);
  font-weight:800;
  font-size:1.08rem;
}
</style>
</head>

<body>
<main>

  <div class="brand">@yulim_mood</div>
  <div class="tagline">Threads에 올린 AI 이미지 프롬프트 모음</div>

  <a
    class="back"
    id="back"
    href="/"
    hidden
  >
    ← 뒤로가기
  </a>

  <div class="panel">

    <h1 id="title">
      프롬프트 아카이브
    </h1>

    <div
      class="meta"
      id="meta"
    >
      데이터를 불러오는 중...
    </div>

    <div id="content"></div>

  </div>

  <div
    class="notice"
    id="notice"
  ></div>

</main>

<script>
/* ────────────────────────────────────────────────
   복사 횟수(Copy count) 설정 — Firebase Realtime Database
   아래 FIREBASE_DB 값만 본인 데이터베이스 주소로 교체하세요.
   예) 'https://yulim-mood-default-rtdb.firebaseio.com'
   (교체 전에는 카운트 기능이 자동으로 꺼진 채로 사이트가 정상 동작합니다)
   ──────────────────────────────────────────────── */
const FIREBASE_DB =
  'https://yulim-mood-prompt-archive-default-rtdb.firebaseio.com';

const COUNTS_ENABLED =
  /^https:\/\/.+\.(firebaseio\.com|firebasedatabase\.app)$/i
    .test(FIREBASE_DB) &&
  !FIREBASE_DB.includes('YOUR-PROJECT');

function countKey(page, cut){
  return [
    String(page.model).toLowerCase(),
    String(page.date),
    'set' + String(page.set).padStart(2, '0'),
    'cut' + String(cut.cut).padStart(2, '0')
  ].join('_');
}

async function loadCounts(){
  if(!COUNTS_ENABLED){
    return {};
  }

  try{
    const res = await fetch(
      FIREBASE_DB + '/copyCounts.json',
      { cache:'no-store' }
    );

    if(!res.ok){
      return {};
    }

    return (await res.json()) || {};
  }catch(error){
    return {};
  }
}

function bumpCount(key){
  if(!COUNTS_ENABLED){
    return;
  }

  fetch(
    FIREBASE_DB + '/copyCounts/' + key + '.json',
    {
      method:'PUT',
      headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({ '.sv':{ 'increment':1 } })
    }
  ).catch(function(){});
}

function cleanPath(){
  let path = decodeURIComponent(location.pathname)
    .replace(/\/+$/, '');

  return path || '/';
}

function formatDate(date){
  return String(date).replace(
    /(\d{4})(\d{2})(\d{2})/,
    '$1.$2.$3'
  );
}

function fallbackCopy(text){
  const textarea = document.createElement('textarea');

  textarea.value = text;
  textarea.setAttribute('readonly', '');
  textarea.style.position = 'fixed';
  textarea.style.opacity = '0';

  document.body.appendChild(textarea);

  textarea.select();
  textarea.setSelectionRange(
    0,
    textarea.value.length
  );

  const result = document.execCommand('copy');

  document.body.removeChild(textarea);

  if(!result){
    throw new Error('copy failed');
  }
}

async function copyText(text){
  if(
    navigator.clipboard &&
    window.isSecureContext
  ){
    await navigator.clipboard.writeText(text);
  }else{
    fallbackCopy(text);
  }
}

function resetBack(){
  document.getElementById('back').hidden = true;
}

function showBack(href, label){
  const back = document.getElementById('back');

  back.href = href;
  back.textContent = label;
  back.hidden = false;
}

function showError(message){
  document.getElementById('title').textContent =
    '페이지를 찾을 수 없어요.';

  document.getElementById('meta').textContent =
    message;

  document.getElementById('content').innerHTML =
    '';

  document.getElementById('notice').textContent =
    '';

  showBack(
    '/',
    '← 전체 목록'
  );
}

function addListLink(
  content,
  href,
  name,
  sub,
  go
){
  const link = document.createElement('a');

  link.className = 'list-link';
  link.href = href;

  const left = document.createElement('span');

  const title = document.createElement('span');

  title.className = 'list-name';
  title.textContent = name;

  const detail = document.createElement('span');

  detail.className = 'list-sub';
  detail.textContent = sub;

  left.append(
    title,
    detail
  );

  const arrow = document.createElement('span');

  arrow.className = 'list-go';
  arrow.textContent = go;

  link.append(
    left,
    arrow
  );

  content.appendChild(link);
}

function renderHome(pages){
  const title =
    document.getElementById('title');

  const meta =
    document.getElementById('meta');

  const content =
    document.getElementById('content');

  const notice =
    document.getElementById('notice');

  const groups = new Map();

  Object.values(pages).forEach(page => {
    if(
      !page ||
      !page.model ||
      !page.date
    ){
      return;
    }

    const model =
      String(page.model).toLowerCase();

    const date =
      String(page.date);

    const key =
      `${model}|${date}`;

    if(!groups.has(key)){
      groups.set(key, {
        model:model,
        date:date,
        sets:0,
        cuts:0
      });
    }

    const group =
      groups.get(key);

    group.sets += 1;

    group.cuts +=
      (page.cuts || []).length;
  });

  const items =
    [...groups.values()]
      .sort((a, b) => {
        const dateCompare =
          b.date.localeCompare(a.date);

        if(dateCompare !== 0){
          return dateCompare;
        }

        return a.model.localeCompare(
          b.model
        );
      });

  document.title =
    '@yulim_mood · 프롬프트 아카이브';

  title.textContent =
    '프롬프트 아카이브';

  meta.textContent =
    `공개된 날짜 ${items.length}개`;

  content.innerHTML = '';

  resetBack();

  if(items.length === 0){
    meta.textContent =
      '현재 공개된 프롬프트가 없습니다.';

    notice.textContent = '';

    return;
  }

  items.forEach(item => {
    addListLink(
      content,

      `/archive/${encodeURIComponent(
        item.model
      )}/${item.date}`,

      formatDate(item.date),

      ` · ${item.model.toUpperCase()} · ${item.sets}세트`,

      '목록 →'
    );
  });

  notice.textContent =
    '날짜를 선택하면 공개된 프롬프트 세트가 표시됩니다.';
}

function parseArchivePath(path){
  const match = path.match(
    /^\/archive\/([a-z0-9_-]+)\/(\d{8})$/i
  );

  if(!match){
    return null;
  }

  return {
    model:match[1].toLowerCase(),
    date:match[2]
  };
}

function renderArchive(
  pages,
  model,
  date
){
  const title =
    document.getElementById('title');

  const meta =
    document.getElementById('meta');

  const content =
    document.getElementById('content');

  const notice =
    document.getElementById('notice');

  const sets =
    Object.keys(pages)
      .map(route => ({
        route:route,
        page:pages[route]
      }))
      .filter(item => {
        if(!item.page){
          return false;
        }

        return (
          String(item.page.model)
            .toLowerCase() === model &&

          String(item.page.date) === date
        );
      })
      .sort((a, b) => {
        return a.page.set - b.page.set;
      });

  if(sets.length === 0){
    showError(
      '이 날짜에 공개된 세트가 없습니다.'
    );

    return;
  }

  document.title =
    `${model.toUpperCase()} ${date} Prompt Sets`;

  title.textContent =
    formatDate(date);

  meta.textContent =
    `${model.toUpperCase()} · 공개 세트 ${sets.length}개`;

  content.innerHTML = '';

  showBack(
    '/',
    '← 날짜 목록'
  );

  sets.forEach(item => {
    addListLink(
      content,

      item.route,

      `SET ${String(
        item.page.set
      ).padStart(2, '0')}`,

      ` · ${(item.page.cuts || []).length}컷`,

      '복사 →'
    );
  });

  notice.textContent =
    '세트를 선택하면 원클릭 복사 페이지로 이동합니다.';
}

function renderPrompt(page){
  const title =
    document.getElementById('title');

  const meta =
    document.getElementById('meta');

  const content =
    document.getElementById('content');

  const notice =
    document.getElementById('notice');

  document.title =
    `${String(page.model).toUpperCase()} ${page.date} SET ${String(page.set).padStart(2, '0')} Prompt Copy`;

  title.textContent =
    String(page.model).toUpperCase();

  meta.textContent =
    `${formatDate(page.date)} · SET ${String(page.set).padStart(2, '0')}`;

  content.innerHTML = '';

  showBack(
    `/archive/${String(page.model).toLowerCase()}/${page.date}`,
    '← 세트 목록'
  );

  const cutRefs = [];

  (page.cuts || []).forEach(cut => {
    const section =
      document.createElement('section');

    section.className =
      'cut';

    section.innerHTML = `
      <div class="cut-number">
        CUT ${String(cut.cut).padStart(2, '0')}
      </div>

      <div class="cut-title"></div>

      <button
        class="copy"
        type="button"
      >
        📋 Copy Prompt
      </button>

      <div class="cut-foot">
        <span class="count"></span>
        <span
          class="status"
          aria-live="polite"
        ></span>
      </div>
    `;

    section
      .querySelector('.cut-title')
      .textContent = cut.title;

    const button =
      section.querySelector('.copy');

    const status =
      section.querySelector('.status');

    const countEl =
      section.querySelector('.count');

    const state = { count:null };

    function renderCount(){
      if(!COUNTS_ENABLED || state.count === null){
        countEl.innerHTML = '';
        return;
      }

      countEl.innerHTML =
        `복사 <b>${state.count.toLocaleString()}</b>회`;
    }

    cutRefs.push({
      key:countKey(page, cut),
      state:state,
      render:renderCount
    });

    button.onclick = async () => {
      button.disabled = true;

      try{
        await copyText(cut.prompt);

        status.className =
          'status';

        status.textContent =
          '✓ Prompt copied';

        if(COUNTS_ENABLED){
          if(state.count === null){
            state.count = 0;
          }

          state.count += 1;

          renderCount();

          bumpCount(countKey(page, cut));
        }

      }catch(error){
        status.className =
          'status warning';

        status.textContent =
          '복사에 실패했습니다.';

      }finally{
        setTimeout(() => {
          status.textContent = '';
          button.disabled = false;
        }, 1800);
      }
    };

    content.appendChild(section);
  });

  if(COUNTS_ENABLED){
    loadCounts().then(counts => {
      cutRefs.forEach(ref => {
        const value = counts[ref.key];

        ref.state.count =
          (typeof value === 'number') ? value : 0;

        ref.render();
      });
    });
  }

  notice.innerHTML =
    '각 버튼은 해당 컷의 프롬프트만 복사합니다.<br>프롬프트 전문은 화면에 표시되지 않습니다.';
}

async function renderStats(pages){
  const title =
    document.getElementById('title');

  const meta =
    document.getElementById('meta');

  const content =
    document.getElementById('content');

  const notice =
    document.getElementById('notice');

  document.title =
    '@yulim_mood · 복사수 랭킹';

  title.textContent =
    '복사수 랭킹';

  meta.textContent =
    '불러오는 중...';

  content.innerHTML = '';
  notice.textContent = '';

  showBack('/', '← 홈으로');

  if(!COUNTS_ENABLED){
    meta.textContent =
      '복사수 집계가 아직 연결되지 않았습니다.';
    return;
  }

  const counts = await loadCounts();

  const rows = [];

  Object.keys(counts).forEach(key => {
    const value = counts[key];

    if(typeof value !== 'number'){
      return;
    }

    const parts = key.split('_');

    if(parts.length < 4){
      return;
    }

    const cutStr = parts[parts.length - 1];
    const setStr = parts[parts.length - 2];
    const date = parts[parts.length - 3];
    const model = parts.slice(0, parts.length - 3).join('_');

    const setNum = parseInt(setStr.replace('set', ''), 10);
    const cutNum = parseInt(cutStr.replace('cut', ''), 10);

    const route =
      `/${model}/${date}/set${String(setNum).padStart(2, '0')}`;

    let cutTitle = '(삭제되었거나 알 수 없는 컷)';

    const page = pages[route];

    if(page){
      const cut =
        (page.cuts || []).find(c => Number(c.cut) === cutNum);

      if(cut){
        cutTitle = cut.title;
      }
    }

    rows.push({
      count:value,
      model:model,
      date:date,
      setNum:setNum,
      cutNum:cutNum,
      route:route,
      title:cutTitle
    });
  });

  rows.sort((a, b) => b.count - a.count);

  if(rows.length === 0){
    meta.textContent =
      '아직 복사된 프롬프트가 없습니다.';
    return;
  }

  const total =
    rows.reduce((sum, r) => sum + r.count, 0);

  meta.textContent =
    `총 ${rows.length}개 컷 · 누적 복사 ${total.toLocaleString()}회`;

  rows.forEach((row, index) => {
    const link = document.createElement('a');

    link.className = 'list-link';
    link.href = row.route;

    const left = document.createElement('span');
    left.className = 'rank-left';

    const badge = document.createElement('span');
    badge.className = (index < 3) ? 'rank top' : 'rank';
    badge.textContent = String(index + 1);

    const info = document.createElement('span');
    info.className = 'rank-info';

    const name = document.createElement('span');
    name.className = 'list-name';
    name.textContent = row.title;

    const sub = document.createElement('span');
    sub.className = 'list-sub';
    sub.textContent =
      `${row.model.toUpperCase()} · ${formatDate(row.date)} · SET ${String(row.setNum).padStart(2, '0')} · CUT ${String(row.cutNum).padStart(2, '0')}`;

    info.append(name, sub);
    left.append(badge, info);

    const cnt = document.createElement('span');
    cnt.className = 'rank-count';
    cnt.innerHTML = `<b>${row.count.toLocaleString()}</b>회`;

    link.append(left, cnt);
    content.appendChild(link);
  });

  notice.textContent =
    '복사수가 높은 순으로 표시됩니다. 항목을 누르면 해당 프롬프트 페이지로 이동합니다.';
}

(async function(){
  try{
    const response = await fetch(
      '/prompts.json?v=' + Date.now(),
      {
        cache:'no-store'
      }
    );

    if(!response.ok){
      throw new Error(
        'prompts.json load failed'
      );
    }

    const pages =
      await response.json();

    const path =
      cleanPath();

    if(path === '/'){
      renderHome(pages);
      return;
    }

    if(path === '/stats'){
      renderStats(pages);
      return;
    }

    const archive =
      parseArchivePath(path);

    if(archive){
      renderArchive(
        pages,
        archive.model,
        archive.date
      );

      return;
    }

    const page =
      pages[path];

    if(!page){
      showError(
        '공개된 세트가 없거나 주소가 잘못되었습니다.'
      );

      return;
    }

    renderPrompt(page);

  }catch(error){
    console.error(error);

    showError(
      '프롬프트 데이터를 불러오지 못했습니다.'
    );
  }
})();
</script>
</body>
</html>
